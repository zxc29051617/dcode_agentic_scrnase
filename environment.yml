name: dcode-scrna
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - scanpy
  - anndata
  - matplotlib
  - seaborn
  - scikit-learn
  - h5py
  - pyyaml
  - pydantic
  - networkx
  - igraph
  - leidenalg
  # seurat_v3 HVG selection (normalize_hvg_prepare) needs its loess fit
  - scikit-misc
  # Sequencing QC for the FASTQ route (fastq_qc skill)
  - fastqc
  - multiqc
  - pip:
      - langchain
      - langgraph
      # Durable human gates: `--interactive` writes the LangGraph checkpoint to
      # runs/<run_id>/checkpoint.sqlite, so a run waiting for a person survives
      # the process and `--continue-from` can answer it later.
      - langgraph-checkpoint-sqlite
      - langchain-openai
      - openai
      - celltypist
      - scrublet
      - harmonypy
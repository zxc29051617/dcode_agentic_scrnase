# The environment this pipeline's results were produced in.
#
# Versions are taken from the environment that passes the suite, not chosen as
# "the latest that should work". The project already has a case study in why:
# `harmonypy` changed the orientation of the matrix it returns between 0.0.10
# and 0.1.0, and scanpy's wrapper assumed the old one — identical code, a
# different answer, and nothing in the pipeline to say so.
#
# `conda-lock.yml` beside this file is what a reproducible install uses. This
# file is the *request*; the lock is the resolved answer, transitive
# dependencies included. Regenerate it whenever this changes:
#
#     conda-lock lock --file environment.yml --platform linux-64
#
# ## Why some scientific packages are pinned on the pip side
#
# They are declared where they actually come from. `scanpy`, `anndata`,
# `pandas` and `scikit-misc` were listed as conda dependencies, but `celltypist`
# and `scrublet` pull them from PyPI during the pip pass and the PyPI builds are
# what ended up installed — so the conda pins described an environment that was
# never the one running. Declaring them once, on the side that wins, is what
# makes the lock reproduce what was tested.
name: dcode-scrna
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.15
  - pip
  # --- numerical core ---------------------------------------------------------
  # Every one of these can change a number in the output.
  - numpy=2.4.6
  - scipy=1.17.1
  - scikit-learn=1.9.0
  - h5py=3.16.0
  # --- graph clustering -------------------------------------------------------
  # `igraph` is the C library, `python-igraph` the binding leidenalg calls;
  # `run_clustering` uses flavor="igraph" because it is deterministic given a
  # seed, so both are pinned rather than left to the solver.
  - igraph=0.10.17
  - python-igraph=0.11.9
  - leidenalg=0.10.2
  - umap-learn=0.5.12
  # --- plotting and misc ------------------------------------------------------
  - matplotlib=3.11.1
  - plotly=6.9.0
  - seaborn=0.13.2
  - networkx=3.6.1
  - pyyaml=6.0.3
  - pydantic=2.13.4
  # --- sequencing QC for the FASTQ route (fastq_qc skill) ---------------------
  # Not optional for the suite: without these on PATH four fastq_qc tests skip
  # and two graph tests fail, because the route reaches a gate it should not.
  - fastqc=0.12.1
  - multiqc=1.35
  - pip:
      # --- single-cell analysis -------------------------------------------
      - pandas==2.3.3
      - scanpy==1.11.5
      - anndata==0.12.19
      # seurat_v3 HVG selection (normalize_hvg_prepare) needs its loess fit
      - scikit-misc==0.5.2
      - harmonypy==2.0.0
      - scrublet==0.2.3
      - celltypist==1.7.1
      # --- orchestration ---------------------------------------------------
      - langgraph==1.2.10
      - langgraph-checkpoint==4.1.1
      # Durable human gates: `--interactive` writes the LangGraph checkpoint to
      # runs/<run_id>/checkpoint.sqlite, so a run waiting for a person survives
      # the process and `--continue-from` can answer it later.
      - langgraph-checkpoint-sqlite==3.1.1
      # --- the judge's model client ----------------------------------------
      # `langchain_openai.ChatOpenAI` is the only LangChain symbol this project
      # imports. The `langchain` meta-package is pinned because it is installed,
      # not because anything imports it.
      - langchain==1.3.14
      - langchain-core==1.5.3
      - langchain-openai==1.4.2
      - openai==2.53.0
